<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2318" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Вход — Дневник калорий</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1d2318;
        color: #f2f0e8;
        font-family: system-ui, sans-serif;
        padding: 1rem;
      }
      main {
        width: 100%;
        max-width: 320px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 1.25rem;
        text-align: center;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      label {
        font-size: 0.875rem;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      input {
        font-size: 1rem;
        padding: 0.6rem 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid #4a5240;
        background: #262e1f;
        color: inherit;
      }
      button {
        margin-top: 0.25rem;
        font-size: 1rem;
        padding: 0.65rem;
        border-radius: 0.5rem;
        border: none;
        background: #7fae42;
        color: #1d2318;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      p[role="alert"] {
        color: #ff9a8a;
        font-size: 0.875rem;
        margin: 0;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Дневник калорий</h1>
      <form id="login-form">
        <label for="username">Логин</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          required
          autofocus
        />

        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <p id="error" role="alert"></p>
        <button type="submit">Войти</button>
      </form>
    </main>
    <script>
      const form = document.getElementById('login-form');
      const errorEl = document.getElementById('error');
      const button = form.querySelector('button');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorEl.textContent = '';
        button.disabled = true;

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ username, password }),
          });

          if (res.ok) {
            const redirect = new URLSearchParams(location.search).get('redirect');
            const safe = redirect && redirect.startsWith('/') && !redirect.startsWith('//');
            // iOS Safari has been observed navigating before it finishes
            // persisting the Set-Cookie from this fetch response, which
            // sends the very next request back out with no session cookie
            // at all — a hair of delay avoids the race.
            setTimeout(() => {
              location.href = safe ? redirect : '/';
            }, 150);
            return;
          }

          const data = await res.json().catch(() => null);
          errorEl.textContent = data?.error || `Не удалось войти (${res.status})`;
        } catch (err) {
          errorEl.textContent = `Ошибка сети, попробуй ещё раз (${err instanceof Error ? err.message : String(err)})`;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
