# calorie-tracker — second site on sg-files-prod, reachable via sslip.io
# Install: sudo cp deploy/nginx-calorie-tracker.conf /etc/nginx/sites-available/calorie-tracker
#          sudo ln -s /etc/nginx/sites-available/calorie-tracker /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then: sudo certbot --nginx -d 78-47-166-130.sslip.io

server {
    listen 80;
    listen [::]:80;
    server_name 78-47-166-130.sslip.io;

    root /var/www/calorie-tracker/dist;
    index index.html;

    # Personal single-user app — keep randos (and bots) from running up
    # the Anthropic API bill. Create with: htpasswd -c /etc/nginx/.htpasswd <user>
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri /index.html;
    }

    # Vite content-hashes these filenames, so a changed file always gets a
    # new URL — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # nginx's default mime.types doesn't know .webmanifest; browsers are
    # lenient but the correct type avoids install-prompt edge cases.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # the service worker file itself must never be cached, or updates to
    # the app can get stuck behind a stale worker.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
