# calorie-tracker — second site on sg-files-prod, reachable via sslip.io
# Install: sudo cp deploy/nginx-calorie-tracker.conf /etc/nginx/sites-available/calorie-tracker
#          sudo ln -s /etc/nginx/sites-available/calorie-tracker /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then: sudo certbot --nginx -d 78-47-166-130.sslip.io

server {
    listen 80;
    listen [::]:80;
    server_name 78-47-166-130.sslip.io;

    root /var/www/calorie-tracker/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
