# calorie-tracker — second site on sg-files-prod, reachable via sslip.io
#
# This file has the SSL block already baked in (paths to an existing
# Let's Encrypt cert) — see deploy/README.md for first-time-vs-redeploy
# instructions. Copying it in and reloading is enough on an already-deployed
# host; a genuinely fresh host needs the cert obtained first (README has the
# command), since `nginx -t` won't pass while those cert files don't exist.

server {
    server_name 78-47-166-130.sslip.io;

    root /var/www/calorie-tracker/dist;
    index index.html;

    # Personal single-user app — keep randos (and bots) from running up the
    # Anthropic API bill. Cookie-based session (checked via auth_request
    # against the backend) instead of Basic Auth: browsers — especially the
    # PWA in standalone mode — don't reliably persist Basic Auth credentials
    # across relaunches, so it kept re-prompting. The cookie lives a year.
    auth_request /auth-check;
    error_page 401 = /login.html?redirect=$request_uri;

    location = /auth-check {
        internal;
        auth_request off;
        # auth_request mirrors the original request's method by default (e.g.
        # POST for /api/analyze) — force GET so it always hits the backend's
        # GET-only /api/auth-check route instead of 404ing on other verbs.
        proxy_method GET;
        proxy_pass http://127.0.0.1:3002/api/auth-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # Must be reachable without a valid session — it's how you get one.
    location = /login.html {
        auth_request off;
    }

    # Favicon/manifest/PWA icons must render on the login page itself
    # (before there's a session), so they can't sit behind auth_request —
    # otherwise the 401 handler serves login.html's *markup* in their
    # place, which browsers can't parse as an icon.
    location ~ ^/(favicon\.ico|apple-touch-icon-180x180\.png|pwa-(64x64|192x192|512x512)\.png|maskable-icon-512x512\.png|manifest\.webmanifest)$ {
        auth_request off;
    }

    location = /api/login {
        auth_request off;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }

    # Vite content-hashes these filenames, so a changed file always gets a
    # new URL — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # nginx's default mime.types doesn't know .webmanifest; browsers are
    # lenient but the correct type avoids install-prompt edge cases.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # the service worker file itself must never be cached, or updates to
    # the app can get stuck behind a stale worker.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/78-47-166-130.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/78-47-166-130.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = 78-47-166-130.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name 78-47-166-130.sslip.io;
    return 404; # managed by Certbot
}
